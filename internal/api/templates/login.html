<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UMMarr · Sign in</title>
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" href="/static/ummarr.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/ummarr-256.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-shell">
    <form class="login-card" method="post" action="/login">
      <div class="brand" style="justify-content:center;margin-bottom:18px">
        <img class="brand-mark" src="/static/ummarr.svg" alt="">
        <div class="brand-name">UMM<span class="brand-arr">arr</span></div>
      </div>
      {{if .Error}}<p class="notice" style="color:var(--warn)">Incorrect username or password.</p>{{end}}
      <input type="text" name="username" placeholder="Username" autofocus required autocomplete="username">
      <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
      <button class="btn" type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
