{{define "album_pass_chip"}}<button type="button" class="season-chip{{if .Monitored}} on{{end}}" hx-post="/music/albumpass/toggle?artist={{.ArtistID}}&album={{.ID}}" hx-swap="outerHTML" title="{{.Title}}{{if .Year}} ({{.Year}}){{end}} - {{if .Monitored}}monitored, click to unmonitor{{else}}unmonitored, click to monitor{{end}}">{{.Title}}{{if .HasFiles}} <span class="season-chip-count">✓</span>{{end}}</button>{{end}}
