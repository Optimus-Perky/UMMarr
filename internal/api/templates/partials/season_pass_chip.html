{{define "season_pass_chip"}}<button type="button" class="season-chip{{if .Monitored}} on{{end}}" hx-post="/tv/seasonpass/toggle?series={{.SeriesID}}&season={{.Number}}" hx-swap="outerHTML" title="{{if .Monitored}}Monitored - click to unmonitor{{else}}Unmonitored - click to monitor{{end}}">{{if eq .Number 0}}Specials{{else}}S{{.Number}}{{end}} <span class="season-chip-count">{{.Downloaded}}/{{.Total}}</span></button>{{end}}
