{{define "track_row"}}
<tr id="track-row-{{.ID}}"{{if .OOB}} hx-swap-oob="true"{{end}}>
  <td>{{.TrackNumber}}</td>
  <td>{{.Title}}</td>
  <td data-col="duration">{{.Duration}}</td>
  <td data-col="quality">{{if .Quality}}<span class="chip chip-info">{{.Quality}}</span>{{end}}</td>
  <td data-col="audio">{{.Audio}}</td>
  <td>{{if .HasFile}}<span class="chip chip-good">{{.FileStatus}}</span>{{else}}<span class="chip chip-warn">{{.FileStatus}}</span>{{end}}</td>
  <td>{{if .HasIndexer}}<button class="btn btn-sm btn-ghost" hx-get="/music/albums/{{.AlbumID}}/tracks/{{.ID}}/releases" hx-target="#release-dialog-body" hx-swap="innerHTML">Find release</button>{{end}}</td>
</tr>
{{end}}
